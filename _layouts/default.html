<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path fill="#17161c" d="M8.6 14 L5 5 L13.6 9.8 Z"/>
            <path fill="#17161c" d="M23.4 14 L27 5 L18.4 9.8 Z"/>
            <circle cx="16" cy="19.6" r="10" fill="#17161c"/>
            <ellipse cx="12.6" cy="19.4" rx="2" ry="2.9" fill="#d8382f"/>
            <ellipse cx="19.4" cy="19.4" rx="2" ry="2.9" fill="#d8382f"/>
            <ellipse cx="16" cy="25.2" rx="1.7" ry="1.2" fill="#f6f1e3"/>
          </svg>
        </span>
        <span>{{ site.title | split: '·' | first | strip }}</span>
      </a>
      <nav aria-label="主导航">
        <ul class="nav-links">
          <li><a href="{{ '/' | relative_url }}#writing">文章</a></li>
          <li><a href="{{ '/' | relative_url }}#projects">项目</a></li>
          <li><a href="{{ '/about.html' | relative_url }}">关于我</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><div class="wrap footer-row"><span>© {{ 'now' | date: '%Y' }} {{ site.title | split: '·' | first | strip }}</span><span><a href="https://github.com/{{ site.author.github }}">GitHub</a>{% if site.author.email %} · <a href="mailto:{{ site.author.email }}">Email</a>{% endif %}</span></div></footer>
</body>
</html>
