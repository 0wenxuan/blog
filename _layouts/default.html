<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path fill="#17161c" d="M9 13 L6.2 5.4 L13.2 9.4 Z"/>
            <path fill="#17161c" d="M23 13 L25.8 5.4 L18.8 9.4 Z"/>
            <circle cx="16" cy="19.2" r="9.6" fill="#17161c"/>
            <ellipse cx="13" cy="19" rx="1.7" ry="2.5" fill="#d8382f"/>
            <circle cx="20" cy="19" r="3.1" fill="none" stroke="#f6f1e3" stroke-width="1.5"/>
            <rect x="10.4" y="3" width="11.2" height="6.6" rx="1" fill="#f6f1e3" stroke="#17161c" stroke-width="1.6"/>
            <rect x="10.4" y="6.9" width="11.2" height="2.5" fill="#d8382f"/>
            <ellipse cx="16" cy="9.6" rx="8.2" ry="1.9" fill="#f6f1e3" stroke="#17161c" stroke-width="1.6"/>
          </svg>
        </span>
        <span>{{ site.title | split: '·' | first | strip }}</span>
      </a>
      <nav aria-label="主导航">
        <ul class="nav-links">
          <li><a href="{{ '/' | relative_url }}#writing">文章</a></li>
          <li><a href="{{ '/' | relative_url }}#projects">项目</a></li>
          <li><a href="{{ '/about.html' | relative_url }}">关于我</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><div class="wrap footer-row"><span>© {{ 'now' | date: '%Y' }} {{ site.title | split: '·' | first | strip }}</span><span><a href="https://github.com/{{ site.author.github }}">GitHub</a>{% if site.author.email %} · <a href="mailto:{{ site.author.email }}">Email</a>{% endif %}</span></div></footer>
</body>
</html>
