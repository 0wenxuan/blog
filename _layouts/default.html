<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path fill="#17161c" d="M13 22 L14.8 8.4 C15 7.2 16.1 6.2 17.3 6.2 L30.7 6.2 C31.9 6.2 33 7.2 33.2 8.4 L35 22 Z"/>
            <path fill="#d8382f" d="M13.9 17.4 L34.1 17.4 L35 22 L13 22 Z"/>
            <ellipse cx="24" cy="22" rx="15.5" ry="3.3" fill="#17161c"/>
            <path fill="#fdf6ea" stroke="#17161c" stroke-width="2.4" stroke-linejoin="round"
                  d="M14.6 24 L33.4 24 L33.4 31 C33.4 37 29.3 41.4 24 41.4 C18.7 41.4 14.6 37 14.6 31 Z"/>
            <circle cx="19.4" cy="30.6" r="5.2" fill="#fffdf6" stroke="#d8382f" stroke-width="2.4"/>
            <circle cx="19.4" cy="30.6" r="1.7" fill="#17161c"/>
            <ellipse cx="29" cy="30.6" rx="2.6" ry="1.8" fill="#17161c"/>
            <path d="M21.6 35.8 C23 37 25 37 26.4 35.8" fill="none" stroke="#17161c" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span>{{ site.title | split: '·' | first | strip }}</span>
      </a>
      <nav aria-label="主导航">
        <ul class="nav-links">
          <li><a href="{{ '/' | relative_url }}#writing">文章</a></li>
          <li><a href="{{ '/' | relative_url }}#projects">项目</a></li>
          <li><a href="{{ '/about.html' | relative_url }}">关于我</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><div class="wrap footer-row"><span>© {{ 'now' | date: '%Y' }} {{ site.title | split: '·' | first | strip }}</span><span><a href="https://github.com/{{ site.author.github }}">GitHub</a>{% if site.author.email %} · <a href="mailto:{{ site.author.email }}">Email</a>{% endif %}</span></div></footer>
</body>
</html>
