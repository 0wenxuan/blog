<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path fill="#17161c" d="M9.6 20.5 L6 6.6 L19.2 13.4 Z"/>
            <path fill="#17161c" d="M38.4 20.5 L42 6.6 L28.8 13.4 Z"/>
            <path fill="#d8382f" d="M11.6 18.2 L9.4 9.6 L17.8 13.6 Z"/>
            <path fill="#d8382f" d="M36.4 18.2 L38.6 9.6 L30.2 13.6 Z"/>
            <circle cx="24" cy="28" r="15.6" fill="#17161c"/>
            <ellipse cx="18.4" cy="27" rx="3.7" ry="4.3" fill="#f6f1e3"/>
            <ellipse cx="18.4" cy="27.4" rx="1.5" ry="3.5" fill="#2b4bb5"/>
            <ellipse cx="29.6" cy="27" rx="3.7" ry="4.3" fill="#f6f1e3"/>
            <ellipse cx="29.6" cy="27.4" rx="1.5" ry="3.5" fill="#2b4bb5"/>
            <path fill="#d8382f" d="M24 32.6 L26.3 35.1 L21.7 35.1 Z"/>
            <path d="M24 35.1 C24 37.4 21.7 38.8 19.4 38" fill="none" stroke="#f6f1e3" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M24 35.1 C24 37.4 26.3 38.8 28.6 38" fill="none" stroke="#f6f1e3" stroke-width="1.7" stroke-linecap="round"/>
            <g stroke="#17161c" stroke-width="1.5" stroke-linecap="round">
              <path d="M7.6 26.6 L2 24.6"/>
              <path d="M7.4 29.8 L1.8 30.4"/>
              <path d="M40.4 26.6 L46 24.6"/>
              <path d="M40.6 29.8 L46.2 30.4"/>
            </g>
          </svg>
        </span>
        <span>{{ site.title | split: '·' | first | strip }}</span>
      </a>
      <nav aria-label="主导航">
        <ul class="nav-links">
          <li><a href="{{ '/' | relative_url }}#writing">文章</a></li>
          <li><a href="{{ '/' | relative_url }}#projects">项目</a></li>
          <li><a href="{{ '/about.html' | relative_url }}">关于我</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><div class="wrap footer-row"><span>© {{ 'now' | date: '%Y' }} {{ site.title | split: '·' | first | strip }}</span><span><a href="https://github.com/{{ site.author.github }}">GitHub</a>{% if site.author.email %} · <a href="mailto:{{ site.author.email }}">Email</a>{% endif %}</span></div></footer>
</body>
</html>
